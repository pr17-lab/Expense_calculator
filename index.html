<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5 mb-5">
        <h2 class="text-center mb-4">Expense Tracker</h2>
        <div class="card mb-4">
            <div class="card-body text-center">
                <h5>Total Expenses</h5>
                <h3 id="totalExpenses" class="text-success">₹0.00</h3>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header fw-bold">
                Add Expense
            </div>
            <div class="card-body">
                <form id="expenseForm">
                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label for="category" class="form-label">
                                Category
                            </label>

                            <select id="category" class="form-select" required>
                                <option value="">Select Category</option>
                                <option value="Food">Food</option>
                                <option value="Transport">Transport</option>
                                <option value="Shopping">Shopping</option>
                                <option value="Bills">Bills</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="amount" class="form-label">
                                Amount (₹)
                            </label>

                            <input type="number" id="amount" class="form-control" placeholder="Enter amount" min="0.01"
                                step="0.01" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="date" class="form-label">
                                Date
                            </label>

                            <input type="date" id="date" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3 d-flex align-items-end">
                            <button type="submit" id="addBtn" class="btn btn-primary">
                                Add Expense
                            </button>
                        </div>

                    </div>

                    <button type="button" id="cancelBtn" class="btn btn-secondary d-none">
                        Cancel Edit
                    </button>

                </form>
            </div>
        </div>


        <div class=" mb-3">

            <select id="filterCategory" class="form-select">
                <option value="">All Categories</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
            </select>

        </div>

        <div class="table-responsive">

            <table class="table table-bordered table-striped align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Category</th>
                        <th>Amount</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="expenseDetails">
                </tbody>
            </table>

        </div>

    </div>

</body>
<script src="script.js"></script>

</html>
